          - 189
          - 3
          - 10
          - 15
        folds:
          - 0
    hparams:
      batch_size: 256
      epochs: 1000
      early_stop:
        patience: 3
        min_delta: 0.0001
      lr_scheduler:
        factor: 0.1
        epochs: 4
      optimizer: 'adam'
      adam:
        learning_rate: 1e-3
      label_smoothing: 0.001
      wbce_ramp_min: 0.01
      model:
        lstm_units: 512
        dropout: 0.3
coding:
  path:
