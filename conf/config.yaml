      processed: ${path.data.processed}/coding
    eval: ${path.eval}/coding
  ccs:
    evaluate:
      cv:
        folds: 10
        shuffle: true
        seeds:
          - 15
          - 999
          - 42
    hparams:
      gauss_noise: 0.1
      units: 512
      dropout_h1: 0.3
      dropout_h2: 0.1
      adam:
        learning_rate: 0.001
      batch_size: 1024
      early_stop:
        patience: 15
      reduce_lr:
        factor: 0.1
        patience: 10
