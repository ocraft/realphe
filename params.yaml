        step_size: 4
      optimizer: adam
      adam:
        lr: 0.001
        betas:
        - 0.9
        - 0.999
        eps: 1.0e-07
      criterion: wbce
      wbce:
        label_smoothing: 0.001
        ramp_min: 0.01
      model:
        lstm_units: 512
        dropout: 0.3
coding:
  path:
    data:
      processed: data/processed/coding
    eval: eval/coding
  ccs:
    evaluate:
      cv:
        folds: 10
        shuffle: true
        seeds:
        - 15
        - 999
        - 42
    hparams:
      gauss_noise: 0.1
      units: 512
      dropout_h1: 0.3
      dropout_h2: 0.1
      epochs: 1000
      optimizer: adam
      adam:
        lr: 0.001
        betas:
        - 0.9
        - 0.999
        eps: 1.0e-07
      batch_size: 1024
      early_stop:
        monitor: eval_aucroc
        mode: max
        patience: 15
        min_delta: 0.0
      scheduler: reduce_lr_on_plateau
      lr_scheduler:
        monitor: eval_aucroc
        scheduler:
          mode: max
          factor: 0.1
          patience: 10
          threshold: 0.0001
