[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realphe"
version = "1.0.1"
authors = [
    { name="Piotr Picheta", email="piotr.a.picheta@gmail.com" }
]
requires-python = "==3.12.13"
readme = "README.md"

dependencies = [
    # framework
    "dvc==3.67.1",
    "dvclive==3.49.0",
    # scientific computing
    "numpy==2.4.4",
    "xarray==2026.4.0",
    "pandas==2.3.3",
    "scikit-learn==1.8.0",
    "iterative-stratification==0.1.9",
    "scipy==1.17.1",
    # data processing
    "dask[complete]==2026.3.0",
    "dask-ml==2025.1.0",
    # pytorch
    "torch==2.11.0",
    "torchmetrics==1.9.0",
    # storage
    "psycopg2-binary==2.9.12",
    "SQLAlchemy==2.0.49",
    "fastparquet==2026.3.0",
    "zarr==3.2.1",
    # plot
    "matplotlib==3.10.9",
    "graphviz==0.21",
    # speedup
    "Bottleneck==1.6.0",
    "numba==0.65.1",
    "flox==0.11.2"
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
"realphe.env" = ["log.ini"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra"
markers = [
    "smoke: lightweight synthetic end-to-end checks that do not require MIMIC-IV",
]

[tool.coverage.run]
source = ["realphe"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]
